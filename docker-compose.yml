# Credos AI System Orchestration

services:
  # 3. Evolution API (WhatsApp Engine v1.8.2)
  evolution:
    image: atendai/evolution-api:v1.8.7
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=42a24fa6-403d-4c7b-b30a-9359e9a4f783
      - TZ=America/Sao_Paulo
      # Otimização Fixa de Memória do Node.js para OCI
      - NODE_OPTIONS=--max_old_space_size=256
    volumes:
      - ./evolution_instances:/evolution/instances
      - ./evolution_data:/evolution/store
    networks:
      - credos_network

  # 4. Backend (FastAPI)
  backend:
    build: .
    container_name: credos-backend
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./backups:/app/data/backups
    environment:
      - DATABASE_DIR=/app/data
      - BACKUP_DIR=/app/data/backups
      - SERVER_URL=http://evolution:8080
      - AUTHENTICATION_API_KEY=42a24fa6-403d-4c7b-b30a-9359e9a4f783
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    depends_on:
      - evolution
    restart: always
    networks:
      - credos_network

  # 5. Frontend (React + Nginx)
  frontend:
    build: ./frontend
    container_name: credos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - credos_network

networks:
  credos_network:
    driver: bridge

volumes:
  backups:
